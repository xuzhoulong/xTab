<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xTab 网址导航</title>
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --danger: #ef4444;
        --border: rgba(255, 255, 255, 0.12);
        --card: rgba(255, 255, 255, 0.08);
        --card-hover: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            1100px 600px at 18% -10%,
            rgba(99, 102, 241, 0.38),
            transparent 60%
          ),
          radial-gradient(
            1000px 520px at 100% 0%,
            rgba(14, 165, 233, 0.28),
            transparent 55%
          ),
          linear-gradient(135deg, #0f172a, #1e293b);
        background-attachment: fixed;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 44px;
      }

      .container {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0 24px;
      }

      .brand {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .add-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .add-btn:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }

      .hero {
        text-align: center;
        padding-bottom: 30px;
      }

      .clock {
        font-size: clamp(44px, 9vw, 76px);
        font-weight: 800;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
      }

      .date {
        margin-top: 4px;
        color: var(--muted);
      }

      .search {
        display: flex;
        max-width: 560px;
        margin: 24px auto 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px;
        backdrop-filter: blur(10px);
      }

      .search input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        padding: 0 16px;
        font-size: 16px;
      }

      .search input::placeholder {
        color: #94a3b8;
      }

      .search button {
        border: 0;
        background: var(--primary);
        color: #fff;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .search button:hover {
        background: var(--primary-dark);
      }

      .sites {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 14px;
      }

      .site-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 8px 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          border-color 0.2s ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .site-card:hover {
        background: var(--card-hover);
        border-color: rgba(255, 255, 255, 0.22);
        transform: translateY(-3px);
      }

      .site-icon {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        color: #fff;
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .site-name {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
      }

      .site-url {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--muted);
      }

      .empty {
        padding: 80px 20px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 20px;
        line-height: 2;
      }

      .hint {
        margin-top: 28px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      .hidden {
        display: none !important;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(2, 6, 23, 0.65);
        backdrop-filter: blur(4px);
      }

      .dialog {
        width: min(420px, 100%);
        background: #111827;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .dialog h2 {
        margin: 0 0 18px;
        font-size: 20px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .form-group input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0f172a;
        color: var(--text);
        padding: 11px 12px;
        font-size: 15px;
        outline: 0;
      }

      .form-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-secondary {
        background: #1e293b;
        color: var(--text);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .context-menu {
        position: fixed;
        z-index: 50;
        min-width: 150px;
        background: #111827;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }

      .menu-btn {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .menu-btn:hover {
        background: #1e293b;
      }

      .menu-btn.danger {
        color: #fca5a5;
      }

      @media (max-width: 640px) {
        .sites {
          grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
          gap: 10px;
        }

        .site-card {
          padding: 16px 6px 14px;
          border-radius: 16px;
        }

        .site-icon {
          width: 48px;
          height: 48px;
          font-size: 22px;
          border-radius: 14px;
        }

        .site-name {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar container">
        <div class="brand">xTab</div>
        <button id="addBtn" class="add-btn" type="button">＋ 添加网址</button>
      </header>

      <section class="hero container">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">加载中...</div>
        <form
          class="search"
          action="https://www.baidu.com/s"
          method="get"
          target="_blank"
          rel="noopener"
        >
          <input
            name="wd"
            type="search"
            placeholder="搜索网页，按回车搜索"
            autocomplete="off"
          />
          <button type="submit">搜索</button>
        </form>
      </section>

      <main class="container">
        <div id="sites" class="sites"></div>
        <div id="empty" class="empty hidden">
          还没有网址<br />
          右键或长按，即可打开菜单添加图标
        </div>
      </main>

      <div class="hint container">
        右键 / 长按页面打开菜单
      </div>
    </div>

    <div id="addModal" class="modal hidden">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addTitle"
      >
        <h2 id="addTitle">添加网址</h2>
        <form id="addForm">
          <div class="form-group">
            <label for="nameInput">网址名称</label>
            <input
              id="nameInput"
              type="text"
              placeholder="例如：GitHub"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="urlInput">网址 URL</label>
            <input
              id="urlInput"
              type="text"
              placeholder="例如：github.com"
              autocomplete="off"
            />
          </div>
          <div class="dialog-actions">
            <button id="cancelBtn" class="btn btn-secondary" type="button">
              取消
            </button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
      >
        <h2 id="settingsTitle">设置</h2>
        <form id="settingsForm">
          <div class="form-group">
            <label for="tokenInput">GitHub Token</label>
            <input
              id="tokenInput"
              type="password"
              placeholder="ghp_..."
              autocomplete="off"
            />
          </div>
          <div class="dialog-actions">
            <button id="settingsCancelBtn" class="btn btn-secondary" type="button">
              取消
            </button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="menu" class="context-menu hidden"></div>

    <script>
      (function () {
        var STORAGE_KEY = "xtab.sites.v1";
        var GITHUB_CONFIG = {
          owner: "xuzhoulong",
          repo: "xTab",
          path: "xtab.json",
          branch: "main",
          token: "",
        };
        var DEFAULT_SITES = [];
        var TOKEN_KEY = "xtab.github.token";
        var sitesEl = document.getElementById("sites");
        var emptyEl = document.getElementById("empty");
        var addModal = document.getElementById("addModal");
        var addForm = document.getElementById("addForm");
        var nameInput = document.getElementById("nameInput");
        var urlInput = document.getElementById("urlInput");
        var menu = document.getElementById("menu");
        var settingsModal = document.getElementById("settingsModal");
        var settingsForm = document.getElementById("settingsForm");
        var tokenInput = document.getElementById("tokenInput");
        var clockEl = document.getElementById("clock");
        var dateEl = document.getElementById("date");
        var addTitle = document.getElementById("addTitle");

        var sites = [];
        var currentSha = null;
        var syncPromise = Promise.resolve();
        var hasLocalChanges = false;
        var currentSiteId = null;
        var editingSiteId = null;
        var longPressTimer = null;
        var longPressInfo = null;
        var suppressContextUntil = 0;
        var ignoreCardClickUntil = 0;

        function uid() {
          return (
            Date.now().toString(36) + Math.random().toString(36).slice(2, 8)
          );
        }

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function readLocalSites() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              return null;
            }
            var data = JSON.parse(raw);
            return Array.isArray(data) ? data : null;
          } catch (error) {
            return null;
          }
        }

        function saveLocalSites(list) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          } catch (error) {
            // 忽略本地存储不可用的情况
          }
        }

        function decodeBase64(value) {
          var cleaned = String(value || "").replace(/\s+/g, "");
          var binary = atob(cleaned);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder("utf-8").decode(bytes);
        }

        function encodeBase64(value) {
          var bytes = new TextEncoder().encode(value);
          var binary = "";
          for (var i = 0; i < bytes.length; i += 1) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        }

        function githubApiHeaders() {
          var token = localStorage.getItem(TOKEN_KEY) || "";
          var headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          if (token) {
            headers.Authorization = "Bearer " + token;
          }
          return headers;
        }

        function fetchRemoteSites(callback) {
          var url =
            "https://api.github.com/repos/" +
            GITHUB_CONFIG.owner +
            "/" +
            GITHUB_CONFIG.repo +
            "/contents/" +
            GITHUB_CONFIG.path +
            "?ref=" +
            encodeURIComponent(GITHUB_CONFIG.branch);
          fetch(url, { headers: githubApiHeaders() })
            .then(function (response) {
              if (response.status === 404) {
                return null;
              }
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              return response.json();
            })
            .then(function (data) {
              if (!data || !data.content) {
                callback([]);
                return;
              }
              currentSha = data.sha;
              var text = decodeBase64(data.content);
              var parsed = JSON.parse(text);
              callback(Array.isArray(parsed) ? parsed : []);
            })
            .catch(function () {
              callback(null);
            });
        }

        function ensureToken(onReady) {
          var token = localStorage.getItem(TOKEN_KEY);
          if (token) {
            onReady(token);
            return;
          }
          var input = window.prompt(
            "请输入 GitHub Personal Access Token（仅保存在本机浏览器，不会写入代码或仓库）：",
          );
          if (input && input.trim()) {
            token = input.trim();
            localStorage.setItem(TOKEN_KEY, token);
            onReady(token);
          } else {
            window.alert("未输入 token，无法同步到 GitHub。");
          }
        }

        function refreshCurrentSha() {
          var url =
            "https://api.github.com/repos/" +
            GITHUB_CONFIG.owner +
            "/" +
            GITHUB_CONFIG.repo +
            "/contents/" +
            GITHUB_CONFIG.path +
            "?ref=" +
            encodeURIComponent(GITHUB_CONFIG.branch);
          return fetch(url, { headers: githubApiHeaders() })
            .then(function (response) {
              if (response.status === 404) {
                currentSha = null;
                return null;
              }
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              return response.json();
            })
            .then(function (data) {
              if (data && data.sha) {
                currentSha = data.sha;
              }
              return currentSha;
            })
            .catch(function () {
              return currentSha;
            });
        }

        function putFile(snapshot) {
          var url =
            "https://api.github.com/repos/" +
            GITHUB_CONFIG.owner +
            "/" +
            GITHUB_CONFIG.repo +
            "/contents/" +
            GITHUB_CONFIG.path;
          var body = {
            message: "Update xtab.json",
            content: encodeBase64(snapshot),
            branch: GITHUB_CONFIG.branch,
          };
          if (currentSha) {
            body.sha = currentSha;
          }
          return fetch(url, {
            method: "PUT",
            headers: Object.assign(
              { "Content-Type": "application/json" },
              githubApiHeaders(),
            ),
            body: JSON.stringify(body),
          })
            .then(function (response) {
              if (!response.ok) {
                return response.json().then(function (error) {
                  var requestError = new Error(
                    error && error.message
                      ? error.message
                      : "HTTP " + response.status,
                  );
                  requestError.status = response.status;
                  throw requestError;
                });
              }
              return response.json();
            })
            .then(function (data) {
              if (data.content && data.content.sha) {
                currentSha = data.content.sha;
              }
            });
        }

        function shouldRetryShaMismatch(error) {
          return (
            error &&
            (error.status === 409 || error.status === 422) &&
            error.message &&
            error.message.indexOf("does not match") !== -1
          );
        }

        function pushSitesToGitHub(list) {
          var snapshot = JSON.stringify(list, null, 2);
          ensureToken(function () {
            syncPromise = syncPromise
              .then(function () {
                return refreshCurrentSha();
              })
              .then(function () {
                return putFile(snapshot);
              })
              .catch(function (error) {
                if (shouldRetryShaMismatch(error)) {
                  return refreshCurrentSha().then(function () {
                    return putFile(snapshot);
                  });
                }
                throw error;
              })
              .catch(function (error) {
                window.alert(
                  "已保存到本机，但同步到 GitHub 失败：" +
                    (error && error.message ? error.message : error),
                );
              });
          });
        }

        function loadSites() {
          var cached = readLocalSites();
          if (cached) {
            sites = cached;
            render();
          }
          fetchRemoteSites(function (remote) {
            if (remote) {
              if (!hasLocalChanges) {
                sites = remote;
                saveLocalSites(sites);
              }
              render();
            } else if (sites.length === 0) {
              render();
            }
          });
        }

        function saveSites() {
          hasLocalChanges = true;
          saveLocalSites(sites);
          pushSitesToGitHub(sites);
        }

        function hostname(url) {
          try {
            return new URL(url).hostname.replace(/^www\./, "");
          } catch (error) {
            return url;
          }
        }

        function initial(name) {
          var first = String(name || "")
            .trim()
            .charAt(0);
          return first ? first.toUpperCase() : "?";
        }

        function iconColor(name) {
          var hash = 0;
          var text = String(name || "");
          for (var i = 0; i < text.length; i += 1) {
            hash = (hash * 31 + text.charCodeAt(i)) % 360;
          }
          var second = (hash + 42) % 360;
          return (
            "linear-gradient(135deg, hsl(" +
            hash +
            " 70% 60%), hsl(" +
            second +
            " 70% 45%))"
          );
        }

        function render() {
          sitesEl.innerHTML = sites
            .map(function (site) {
              return (
                '<a class="site-card" href="' +
                escapeHtml(site.url) +
                '" target="_blank" rel="noopener" data-id="' +
                escapeHtml(site.id) +
                '" title="' +
                escapeHtml(site.name) +
                '">' +
                '<span class="site-icon" style="background:' +
                iconColor(site.name) +
                '">' +
                escapeHtml(initial(site.name)) +
                "</span>" +
                '<span class="site-name">' +
                escapeHtml(site.name) +
                "</span>" +
                '<span class="site-url">' +
                escapeHtml(hostname(site.url)) +
                "</span>" +
                "</a>"
              );
            })
            .join("");

          emptyEl.classList.toggle("hidden", sites.length > 0);
          sitesEl.classList.toggle("hidden", sites.length === 0);
        }

        function normalizeUrl(value) {
          var input = String(value || "").trim();
          if (!input) {
            throw new Error("empty");
          }
          if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(input)) {
            input = "https://" + input;
          }
          var url = new URL(input);
          if (url.protocol !== "http:" && url.protocol !== "https:") {
            throw new Error("invalid protocol");
          }
          return url.href;
        }

        function openAddModal(site) {
          closeMenu();
          editingSiteId = site ? site.id : null;
          addTitle.textContent = site ? "编辑网址" : "添加网址";
          nameInput.value = site ? site.name : "";
          urlInput.value = site ? site.url : "";
          addModal.classList.remove("hidden");
          window.setTimeout(function () {
            urlInput.focus();
            if (site) {
              urlInput.select();
            }
          }, 0);
        }

        function closeAddModal() {
          addModal.classList.add("hidden");
          editingSiteId = null;
        }

        function openSettingsModal() {
          closeMenu();
          tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";
          settingsModal.classList.remove("hidden");
          window.setTimeout(function () {
            tokenInput.focus();
          }, 0);
        }

        function closeSettingsModal() {
          settingsModal.classList.add("hidden");
        }

        function closeMenu() {
          menu.classList.add("hidden");
          currentSiteId = null;
        }

        function showMenu(x, y, id) {
          currentSiteId = id || null;
          if (id) {
            var site = sites.find(function (item) {
              return item.id === id;
            });
            if (!site) {
              return;
            }
            menu.innerHTML =
              '<button class="menu-btn" data-action="open" type="button">打开网址</button>' +
              '<button class="menu-btn" data-action="edit" type="button">编辑</button>' +
              '<button class="menu-btn danger" data-action="delete" type="button">删除</button>';
          } else {
            menu.innerHTML =
              '<button class="menu-btn" data-action="add" type="button">添加图标</button>' +
              '<button class="menu-btn" data-action="settings" type="button">设置</button>';
          }

          menu.classList.remove("hidden");
          menu.style.left = "0px";
          menu.style.top = "0px";

          var rect = menu.getBoundingClientRect();
          var left = Math.max(
            8,
            Math.min(x, window.innerWidth - rect.width - 8),
          );
          var top = Math.max(
            8,
            Math.min(y, window.innerHeight - rect.height - 8),
          );
          menu.style.left = left + "px";
          menu.style.top = top + "px";
        }

        function openSite(id) {
          var site = sites.find(function (item) {
            return item.id === id;
          });
          if (site) {
            window.open(site.url, "_blank", "noopener");
          }
        }

        function openEditSite(id) {
          var site = sites.find(function (item) {
            return item.id === id;
          });
          if (site) {
            openAddModal(site);
          }
        }

        function deleteSite(id) {
          var site = sites.find(function (item) {
            return item.id === id;
          });
          if (!site) {
            return;
          }
          if (!window.confirm("确定删除「" + site.name + "」吗？")) {
            return;
          }
          sites = sites.filter(function (item) {
            return item.id !== id;
          });
          saveSites();
          render();
          closeMenu();
        }

        function updateClock() {
          var now = new Date();
          var hours = String(now.getHours()).padStart(2, "0");
          var minutes = String(now.getMinutes()).padStart(2, "0");
          var weekdays = [
            "星期日",
            "星期一",
            "星期二",
            "星期三",
            "星期四",
            "星期五",
            "星期六",
          ];
          clockEl.textContent = hours + ":" + minutes;
          dateEl.textContent =
            now.getFullYear() +
            "年" +
            (now.getMonth() + 1) +
            "月" +
            now.getDate() +
            "日 " +
            weekdays[now.getDay()];
        }

        document
          .getElementById("addBtn")
          .addEventListener("click", function () {
            openAddModal();
          });
        document
          .getElementById("cancelBtn")
          .addEventListener("click", closeAddModal);
        addModal.addEventListener("click", function (event) {
          if (event.target === addModal) {
            closeAddModal();
          }
        });
        document
          .getElementById("settingsCancelBtn")
          .addEventListener("click", closeSettingsModal);
        settingsModal.addEventListener("click", function (event) {
          if (event.target === settingsModal) {
            closeSettingsModal();
          }
        });
        settingsForm.addEventListener("submit", function (event) {
          event.preventDefault();
          var token = tokenInput.value.trim();
          if (token) {
            localStorage.setItem(TOKEN_KEY, token);
          } else {
            localStorage.removeItem(TOKEN_KEY);
          }
          closeSettingsModal();
        });

        addForm.addEventListener("submit", function (event) {
          event.preventDefault();
          var name = nameInput.value.trim();
          var rawUrl = urlInput.value.trim();

          if (!rawUrl) {
            window.alert("请输入网址 URL");
            return;
          }

          var url;
          try {
            url = normalizeUrl(rawUrl);
          } catch (error) {
            window.alert("网址无效，请输入类似 example.com 的地址");
            return;
          }

          if (editingSiteId) {
            var editIndex = sites.findIndex(function (item) {
              return item.id === editingSiteId;
            });
            if (editIndex !== -1) {
              sites[editIndex] = {
                id: editingSiteId,
                name: name || hostname(url),
                url: url,
              };
            }
          } else {
            sites.push({
              id: uid(),
              name: name || hostname(url),
              url: url,
            });
          }
          saveSites();
          render();
          closeAddModal();
        });

        sitesEl.addEventListener("click", function (event) {
          var card = event.target.closest(".site-card");
          if (card && Date.now() < ignoreCardClickUntil) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        document.addEventListener("contextmenu", function (event) {
          event.preventDefault();

          if (event.target.closest(".context-menu")) {
            return;
          }
          if (Date.now() < suppressContextUntil) {
            return;
          }

          var card = event.target.closest(".site-card");
          if (card) {
            showMenu(event.clientX, event.clientY, card.dataset.id);
          } else {
            showMenu(event.clientX, event.clientY);
          }
        });

        menu.addEventListener("click", function (event) {
          var button = event.target.closest(".menu-btn");
          if (!button) {
            return;
          }
          var id = currentSiteId;
          var action = button.dataset.action;
          closeMenu();

          if (action === "open") {
            openSite(id);
          } else if (action === "edit") {
            openEditSite(id);
          } else if (action === "delete") {
            deleteSite(id);
          } else if (action === "add") {
            openAddModal();
          } else if (action === "settings") {
            openSettingsModal();
          }
        });

        document.addEventListener("click", function (event) {
          if (!menu.contains(event.target)) {
            closeMenu();
          }
        });

        window.addEventListener("scroll", closeMenu, true);
        window.addEventListener("resize", closeMenu);
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeMenu();
            closeAddModal();
            closeSettingsModal();
          }
        });

        document.addEventListener(
          "touchstart",
          function (event) {
            if (event.touches.length !== 1) {
              return;
            }
            var touch = event.touches[0];
            longPressInfo = {
              x: touch.clientX,
              y: touch.clientY,
              target: event.target,
              long: false,
            };
            clearTimeout(longPressTimer);
            longPressTimer = window.setTimeout(function () {
              if (!longPressInfo) {
                return;
              }
              longPressInfo.long = true;
              suppressContextUntil = Date.now() + 900;

              if (
                longPressInfo.target.closest("input, textarea, button, .modal")
              ) {
                return;
              }

              var card = longPressInfo.target.closest(".site-card");
              if (card) {
                ignoreCardClickUntil = Date.now() + 900;
                showMenu(longPressInfo.x, longPressInfo.y, card.dataset.id);
              } else {
                showMenu(longPressInfo.x, longPressInfo.y);
              }

              if (navigator.vibrate) {
                navigator.vibrate(20);
              }
            }, 550);
          },
          { passive: true },
        );

        function cancelLongPress() {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          longPressInfo = null;
        }

        document.addEventListener(
          "touchmove",
          function (event) {
            if (!longPressInfo) {
              return;
            }
            var touch = event.touches[0];
            var dx = touch.clientX - longPressInfo.x;
            var dy = touch.clientY - longPressInfo.y;
            if (dx * dx + dy * dy > 100) {
              cancelLongPress();
            }
          },
          { passive: true },
        );

        document.addEventListener("touchend", function (event) {
          if (longPressInfo && longPressInfo.long) {
            event.preventDefault();
          }
          cancelLongPress();
        });

        document.addEventListener("touchcancel", cancelLongPress);

        loadSites();
        updateClock();
        window.setInterval(updateClock, 1000);
      })();
    </script>
  </body>
</html>
