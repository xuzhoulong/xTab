<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xTab 网址导航</title>
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --danger: #ef4444;
        --border: rgba(255, 255, 255, 0.12);
        --card: rgba(255, 255, 255, 0.08);
        --card-hover: rgba(255, 255, 255, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        height: 100%;
        min-height: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            1100px 600px at 18% -10%,
            rgba(99, 102, 241, 0.38),
            transparent 60%
          ),
          radial-gradient(
            1000px 520px at 100% 0%,
            rgba(14, 165, 233, 0.28),
            transparent 55%
          ),
          linear-gradient(135deg, #0f172a, #1e293b);
        background-attachment: fixed;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      .page {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 20px 16px 44px;
        overflow: hidden;
      }

      .container {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      main.container {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0 24px;
      }

      .brand {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .add-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .add-btn:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }

      .hero {
        text-align: center;
        padding-bottom: 30px;
      }

      .clock {
        font-size: clamp(44px, 9vw, 76px);
        font-weight: 800;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
      }

      .date {
        margin-top: 4px;
        color: var(--muted);
      }

      .search {
        display: flex;
        max-width: 560px;
        margin: 24px auto 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px;
        backdrop-filter: blur(10px);
      }

      .search input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--text);
        padding: 0 16px;
        font-size: 16px;
      }

      .search input::placeholder {
        color: #94a3b8;
      }

      .search button {
        border: 0;
        background: var(--primary);
        color: #fff;
        border-radius: 999px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .search button:hover {
        background: var(--primary-dark);
      }

      .sites {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 14px;
        align-content: start;
        grid-auto-rows: max-content;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 4px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .sites::-webkit-scrollbar {
        display: none;
      }

      .site-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 4px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        transition:
          background 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .site-card:hover {
        background: var(--card-hover);
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }

      .site-icon {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        color: #fff;
        font-size: 26px;
        font-weight: 800;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      }

      .site-name {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
      }

      .site-url {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--muted);
      }

      .empty {
        padding: 80px 20px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 20px;
        line-height: 2;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .empty::-webkit-scrollbar {
        display: none;
      }

      .hint {
        margin-top: 28px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      .hidden {
        display: none !important;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(2, 6, 23, 0.65);
        backdrop-filter: blur(4px);
      }

      .dialog {
        width: min(420px, 100%);
        background: #111827;
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .dialog h2 {
        margin: 0 0 18px;
        font-size: 20px;
      }

      .settings-dialog {
        width: min(680px, 100%);
      }

      .settings-layout {
        display: flex;
        gap: 20px;
      }

      .settings-tabs {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 120px;
        flex: 0 0 120px;
        border-right: 1px solid var(--border);
        padding-right: 16px;
      }

      .settings-tab {
        border: 0;
        background: transparent;
        color: var(--muted);
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
      }

      .settings-tab:hover {
        background: #1e293b;
      }

      .settings-tab.active {
        background: var(--primary);
        color: #fff;
      }

      .settings-panels {
        flex: 1;
        min-width: 0;
      }

      .settings-panel {
        display: none;
      }

      .settings-panel.active {
        display: block;
      }

      .settings-panel h3 {
        margin: 0 0 16px;
        font-size: 16px;
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .setting-row label {
        color: var(--text);
        font-size: 14px;
      }

      .setting-row input[type="checkbox"] {
        position: relative;
        width: 42px;
        height: 22px;
        margin: 0;
        flex: 0 0 auto;
        appearance: none;
        -webkit-appearance: none;
        background: rgba(148, 163, 184, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        outline: 0;
        cursor: pointer;
        transition:
          background 0.2s ease,
          border-color 0.2s ease;
      }

      .setting-row input[type="checkbox"]::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        transition: transform 0.2s ease;
      }

      .setting-row input[type="checkbox"]:checked {
        background: var(--primary);
        border-color: var(--primary);
      }

      .setting-row input[type="checkbox"]:checked::before {
        transform: translateX(20px);
      }

      .custom-select {
        position: relative;
        min-width: 130px;
      }

      .custom-select-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0f172a;
        color: var(--text);
        padding: 8px 10px;
        font-size: 14px;
        cursor: pointer;
        outline: 0;
      }

      .custom-select-trigger:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .custom-select-arrow {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(45deg) translateY(-2px);
        transition: transform 0.2s ease;
      }

      .custom-select.open .custom-select-arrow {
        transform: rotate(225deg) translateY(1px);
      }

      .custom-select-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0f172a;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
      }

      .custom-select-option {
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        padding: 8px 10px;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }

      .custom-select-option:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .custom-select-option.selected {
        background: rgba(99, 102, 241, 0.28);
        color: #fff;
      }

      @media (max-width: 640px) {
        .settings-layout {
          flex-direction: column;
        }

        .settings-tabs {
          flex-direction: row;
          width: 100%;
          flex: none;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding-right: 0;
          padding-bottom: 10px;
        }

        .settings-tab {
          flex: 1;
          text-align: center;
        }
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .form-group input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #0f172a;
        color: var(--text);
        padding: 11px 12px;
        font-size: 15px;
        outline: 0;
      }

      .form-group input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 8px;
      }

      .btn {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-secondary {
        background: #1e293b;
        color: var(--text);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-danger {
        background: var(--danger);
        color: #fff;
      }

      .confirm-message {
        margin: 0 0 8px;
        color: var(--muted);
        line-height: 1.6;
      }

      .context-menu {
        position: fixed;
        z-index: 50;
        min-width: 150px;
        background: #111827;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }

      .menu-btn {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .menu-btn:hover {
        background: #1e293b;
      }

      .menu-btn.danger {
        color: #fca5a5;
      }

      @media (max-width: 640px) {
        .sites {
          grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
          gap: 10px;
        }

        .site-card {
          padding: 16px 6px;
          border-radius: 16px;
        }

        .site-icon {
          width: 48px;
          height: 48px;
          font-size: 22px;
          border-radius: 14px;
        }

        .site-name {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar container">
        <div class="brand">xTab</div>
        <button id="addBtn" class="add-btn" type="button">＋ 添加图标</button>
      </header>

      <section class="hero container">
        <div id="clock" class="clock">00:00</div>
        <div id="date" class="date">加载中...</div>
        <form
          id="searchForm"
          class="search"
          action="https://www.baidu.com/s"
          method="get"
          target="_blank"
          rel="noopener"
        >
          <input
            name="wd"
            type="search"
            placeholder="搜索网页，按回车搜索"
            autocomplete="off"
          />
          <button type="submit">搜索</button>
        </form>
      </section>

      <main class="container">
        <div id="sites" class="sites"></div>
        <div id="empty" class="empty hidden">
          还没有网址<br />
          右键或长按，即可打开菜单添加图标
        </div>
      </main>

      <div class="hint container">右键 / 长按页面打开菜单</div>
    </div>

    <div id="addModal" class="modal hidden">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addTitle"
      >
        <h2 id="addTitle">添加图标</h2>
        <form id="addForm">
          <div class="form-group">
            <label for="nameInput">网址名称</label>
            <input
              id="nameInput"
              type="text"
              placeholder="例如：GitHub"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="urlInput">网址 URL</label>
            <input
              id="urlInput"
              type="text"
              placeholder="例如：github.com"
              autocomplete="off"
            />
          </div>
          <div class="dialog-actions">
            <button id="cancelBtn" class="btn btn-secondary" type="button">
              取消
            </button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="tokenModal" class="modal hidden">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tokenTitle"
      >
        <h2 id="tokenTitle">输入 GitHub Token</h2>
        <form id="tokenForm">
          <div class="form-group">
            <label for="promptTokenInput">GitHub Token</label>
            <input
              id="promptTokenInput"
              type="password"
              placeholder="ghp_..."
              autocomplete="off"
            />
          </div>
          <div class="dialog-actions">
            <button id="tokenCancelBtn" class="btn btn-secondary" type="button">
              取消
            </button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="confirmModal" class="modal hidden">
      <div
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmTitle"
      >
        <h2 id="confirmTitle">确认删除</h2>
        <p id="confirmMessage" class="confirm-message"></p>
        <div class="dialog-actions">
          <button id="confirmCancelBtn" class="btn btn-secondary" type="button">
            取消
          </button>
          <button id="confirmOkBtn" class="btn btn-danger" type="button">
            删除
          </button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden">
      <div
        class="dialog settings-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
      >
        <h2 id="settingsTitle">设置</h2>
        <form id="settingsForm">
          <div class="settings-layout">
            <div class="settings-tabs" id="settingsTabs">
              <button class="settings-tab active" type="button" data-tab="time">
                时间
              </button>
              <button class="settings-tab" type="button" data-tab="search">
                搜索
              </button>
              <button class="settings-tab" type="button" data-tab="icon">
                图标
              </button>
              <button class="settings-tab" type="button" data-tab="config">
                配置
              </button>
            </div>
            <div class="settings-panels">
              <section class="settings-panel active" data-panel="time">
                <h3>时间</h3>
                <div class="setting-row">
                  <label for="showTimeInput">显示时间</label>
                  <input id="showTimeInput" type="checkbox" />
                </div>
                <div class="setting-row">
                  <label for="showMonthDayInput">显示月日</label>
                  <input id="showMonthDayInput" type="checkbox" />
                </div>
                <div class="setting-row">
                  <label for="showWeekInput">显示星期</label>
                  <input id="showWeekInput" type="checkbox" />
                </div>
                <div class="setting-row">
                  <label for="showLunarInput">显示农历</label>
                  <input id="showLunarInput" type="checkbox" />
                </div>
                <div class="setting-row">
                  <label>时间格式</label>
                  <div class="custom-select" id="hourFormatSelect">
                    <button
                      id="hourFormatTrigger"
                      class="custom-select-trigger"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                    >
                      <span id="hourFormatValue">24小时制</span>
                      <span
                        class="custom-select-arrow"
                        aria-hidden="true"
                      ></span>
                    </button>
                    <div
                      id="hourFormatMenu"
                      class="custom-select-menu hidden"
                      role="listbox"
                    >
                      <button
                        class="custom-select-option"
                        type="button"
                        role="option"
                        data-value="24"
                      >
                        24小时制
                      </button>
                      <button
                        class="custom-select-option"
                        type="button"
                        role="option"
                        data-value="12"
                      >
                        12小时制
                      </button>
                    </div>
                  </div>
                </div>
                <div class="setting-row">
                  <label for="showSecondsInput">显示秒</label>
                  <input id="showSecondsInput" type="checkbox" />
                </div>
              </section>
              <section class="settings-panel" data-panel="search">
                <h3>搜索</h3>
                <div class="setting-row">
                  <label for="showSearchInput">显示搜索框</label>
                  <input id="showSearchInput" type="checkbox" />
                </div>
              </section>
              <section class="settings-panel" data-panel="icon">
                <h3>图标</h3>
                <div class="setting-row">
                  <label for="showSiteNameInput">显示网址名称</label>
                  <input id="showSiteNameInput" type="checkbox" />
                </div>
                <div class="setting-row">
                  <label for="showSiteUrlInput">显示网址 URL</label>
                  <input id="showSiteUrlInput" type="checkbox" />
                </div>
              </section>
              <section class="settings-panel" data-panel="config">
                <h3>配置</h3>
                <div class="form-group">
                  <label for="ownerInput">Owner</label>
                  <input
                    id="ownerInput"
                    type="text"
                    placeholder="例如：xuzhoulong"
                    autocomplete="off"
                  />
                </div>
                <div class="form-group">
                  <label for="repoInput">Repo</label>
                  <input
                    id="repoInput"
                    type="text"
                    placeholder="例如：xTab"
                    autocomplete="off"
                  />
                </div>
                <div class="form-group">
                  <label for="pathInput">数据文件路径</label>
                  <input
                    id="pathInput"
                    type="text"
                    placeholder="例如：xtab.json"
                    autocomplete="off"
                  />
                </div>
                <div class="form-group">
                  <label for="branchInput">Branch</label>
                  <input
                    id="branchInput"
                    type="text"
                    placeholder="main"
                    autocomplete="off"
                  />
                </div>
                <div class="form-group">
                  <label for="tokenInput">GitHub Token</label>
                  <input
                    id="tokenInput"
                    type="password"
                    placeholder="ghp_..."
                    autocomplete="off"
                  />
                </div>
              </section>
            </div>
          </div>
          <div class="dialog-actions">
            <button
              id="settingsCancelBtn"
              class="btn btn-secondary"
              type="button"
            >
              取消
            </button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <div id="menu" class="context-menu hidden"></div>

    <script>
      (function () {
        var STORAGE_KEY = "xtab.sites.v1";
        var CONFIG_KEY = "xtab.github.config";
        var DEFAULT_GITHUB_CONFIG = {
          owner: "",
          repo: "",
          path: "",
          branch: "",
        };
        var DEFAULT_SITES = [];
        var TOKEN_KEY = "xtab.github.token";
        var SETTINGS_KEY = "xtab.settings.v1";
        var DEFAULT_SETTINGS = {
          showTime: true,
          showMonthDay: true,
          showWeek: true,
          showLunar: true,
          hour24: true,
          showSeconds: true,
          showSearch: true,
          showSiteName: true,
          showSiteUrl: true,
        };
        var sitesEl = document.getElementById("sites");
        var emptyEl = document.getElementById("empty");
        var addModal = document.getElementById("addModal");

        function decodeBase64(value) {
          var cleaned = String(value || "").replace(/\s+/g, "");
          var binary = atob(cleaned);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder("utf-8").decode(bytes);
        }

        function encodeBase64(value) {
          var bytes = new TextEncoder().encode(value);
          var binary = "";
          for (var i = 0; i < bytes.length; i += 1) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        }

        function githubApiHeaders() {
          var token = localStorage.getItem(TOKEN_KEY) || "";
          var headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          if (token) {
            headers.Authorization = "Bearer " + token;
          }
          return headers;
        }

        function fetchRemoteSites(callback) {
          var url =
            "https://api.github.com/repos/" +
            githubConfig.owner +
            "/" +
            githubConfig.repo +
            "/contents/" +
            githubConfig.path +
            "?ref=" +
            encodeURIComponent(githubConfig.branch) +
            "&_=" +
            Date.now();
          fetch(url, { headers: githubApiHeaders(), cache: "no-store" })
            .then(function (response) {
              if (response.status === 404) {
                return null;
              }
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              return response.json();
            })
            .then(function (data) {
              if (!data || !data.content) {
                callback([]);
                return;
              }
              currentSha = data.sha;
              var text = decodeBase64(data.content);
              var parsed = JSON.parse(text);
              callback(Array.isArray(parsed) ? parsed : []);
            })
            .catch(function () {
              callback(null);
            });
        }

        function refreshCurrentSha() {
          var url =
            "https://api.github.com/repos/" +
            githubConfig.owner +
            "/" +
            githubConfig.repo +
            "/contents/" +
            githubConfig.path +
            "?ref=" +
            encodeURIComponent(githubConfig.branch) +
            "&_=" +
            Date.now();
          return fetch(url, { headers: githubApiHeaders(), cache: "no-store" })
            .then(function (response) {
              if (response.status === 404) {
                currentSha = null;
                return null;
              }
              if (!response.ok) {
                throw new Error("HTTP " + response.status);
              }
              return response.json();
            })
            .then(function (data) {
              var sha = data && data.sha ? data.sha : null;
              currentSha = sha;
              return sha;
            });
        }

        function putFile(snapshot, sha) {
          var url =
            "https://api.github.com/repos/" +
            githubConfig.owner +
            "/" +
            githubConfig.repo +
            "/contents/" +
            githubConfig.path;
          var body = {
            message: "Update " + githubConfig.path,
            content: encodeBase64(snapshot),
            branch: githubConfig.branch,
          };
          if (sha) {
            body.sha = sha;
          }
          return fetch(url, {
            method: "PUT",
            headers: Object.assign(
              { "Content-Type": "application/json" },
              githubApiHeaders(),
            ),
            body: JSON.stringify(body),
          })
            .then(function (response) {
              if (!response.ok) {
                return response.json().then(function (error) {
                  var requestError = new Error(
                    error && error.message
                      ? error.message
                      : "HTTP " + response.status,
                  );
                  requestError.status = response.status;
                  throw requestError;
                });
              }
              return response.json();
            })
            .then(function (data) {
              if (data.content && data.content.sha) {
                currentSha = data.content.sha;
              }
              return data;
            });
        }

        function shouldRetryShaMismatch(error) {
          return (
            error &&
            (error.status === 409 || error.status === 422) &&
            error.message &&
            (error.message.indexOf("does not match") !== -1 ||
              error.message.toLowerCase().indexOf("sha") !== -1)
          );
        }

        function getLatestSha() {
          return refreshCurrentSha().catch(function () {
            return currentSha;
          });
        }

        function pushWithRetry(snapshot, attemptsLeft) {
          return getLatestSha()
            .then(function (sha) {
              return putFile(snapshot, sha);
            })
            .catch(function (error) {
              if (shouldRetryShaMismatch(error) && attemptsLeft > 0) {
                return new Promise(function (resolve) {
                  window.setTimeout(function () {
                    resolve(pushWithRetry(snapshot, attemptsLeft - 1));
                  }, 300);
                });
              }
              throw error;
            });
        }

        function pushSitesToGitHub(list) {
          var snapshot = JSON.stringify(list, null, 2);
          ensureToken(function () {
            syncPromise = syncPromise
              .then(function () {
                return pushWithRetry(snapshot, 3);
              })
              .catch(function (error) {
                window.alert(
                  "已保存到本机，但同步到 GitHub 失败：" +
                    (error && error.message ? error.message : error),
                );
              });
          });
        }

        function loadSites() {
          var cached = readLocalSites();
          if (cached) {

          fetchRemoteSites(function (remote) {
            if (remote) {
              if (!hasLocalChanges) {
                sites = remote;
                saveLocalSites(sites);
              }
              render();
            } else if (sites.length === 0) {
              render();
            }
          });
        }

        function saveSites() {
          hasLocalChanges = true;
          saveLocalSites(sites);
          pushSitesToGitHub(sites);
        }

        function hostname(url) {
          try {
            return new URL(url).hostname.replace(/^www\./, "");
          } catch (error) {
            return url;
          }
        }

        function initial(name) {
          var first = String(name || "")
            .trim()
            .charAt(0);
          return first ? first.toUpperCase() : "?";
        }

        function iconColor(name) {
          var hash = 0;
          var text = String(name || "");
          for (var i = 0; i < text.length; i += 1) {
            hash = (hash * 31 + text.charCodeAt(i)) % 360;
          }
          var second = (hash + 42) % 360;
          return (
            "linear-gradient(135deg, hsl(" +
            hash +
            " 70% 60%), hsl(" +
            second +
            " 70% 45%))"
          );
        }

        function normalizeUrl(value) {
          var input = String(value || "").trim();
          if (!input) {
            throw new Error("empty");
          }
          if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(input)) {
            input = "https://" + input;
          }
          var url = new URL(input);
          if (url.protocol !== "http:" && url.protocol !== "https:") {
            throw new Error("invalid protocol");
          }
          return url.href;
        }

        function lunarDayText(day) {
          var digits = [
            "零",
            "一",
            "二",
            "三",
            "四",
            "五",
            "六",
            "七",
            "八",
            "九",
          ];
          if (day === 10) {
            return "初十";
          }
          if (day === 20) {
            return "二十";
          }
          if (day === 30) {
            return "三十";
          }
          if (day < 10) {
            return "初" + digits[day];
          }
          if (day < 20) {
            return "十" + digits[day % 10];
          }
          if (day < 30) {
            return "廿" + digits[day % 10];
          }
          return "";
        }

        function getLunarText(date) {
          try {
            var parts = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {
              month: "long",
              day: "numeric",
            }).formatToParts(date);
            var month = "";
            var day = "";
            parts.forEach(function (part) {
              if (part.type === "month") {
                month = part.value;
              }
              if (part.type === "day") {
                day = part.value;
              }
            });
            return month + lunarDayText(parseInt(day, 10) || 0);
          } catch (error) {
            return "";
          }
        }

        function updateClock() {
          if (!settings.showTime) {
            clockEl.classList.add("hidden");
            dateEl.classList.add("hidden");
            return;
          }

          var now = new Date();
          var hours = now.getHours();
          var minutes = String(now.getMinutes()).padStart(2, "0");
          var seconds = String(now.getSeconds()).padStart(2, "0");
          var suffix = "";

          if (!settings.hour24) {
            suffix = hours < 12 ? " AM" : " PM";
            hours = hours % 12;
            if (hours === 0) {
              hours = 12;
            }
          }
          hours = String(hours).padStart(2, "0");

          var timeText = hours + ":" + minutes;
          if (settings.showSeconds) {
            timeText += ":" + seconds;
          }
          timeText += suffix;

          clockEl.textContent = timeText;
          clockEl.classList.remove("hidden");

          var weekdays = [
            "星期日",
            "星期一",
            "星期二",
            "星期三",
            "星期四",
            "星期五",
            "星期六",
          ];
          var parts = [];
          if (settings.showMonthDay) {
            parts.push(now.getMonth() + 1 + "月" + now.getDate() + "日");
          }
          if (settings.showWeek) {
            parts.push(weekdays[now.getDay()]);
          }
          if (settings.showLunar) {
            var lunarText = getLunarText(now);
            if (lunarText) {
              parts.push("农历" + lunarText);
            }
          }

          if (parts.length > 0) {
            dateEl.textContent = parts.join(" · ");
            dateEl.classList.remove("hidden");
          } else {
            dateEl.classList.add("hidden");
          }
        }

            closeHourFormatMenu();
          }
        });
        settingsForm.addEventListener("submit", function (event) {
          event.preventDefault();
          editingSettings.showTime = showTimeInput.checked;
          editingSettings.showMonthDay = showMonthDayInput.checked;
          editingSettings.showWeek = showWeekInput.checked;
          editingSettings.showLunar = showLunarInput.checked;
          editingSettings.hour24 = hourFormatSelect.dataset.value === "24";
          editingSettings.showSeconds = showSecondsInput.checked;
          editingSettings.showSearch = showSearchInput.checked;
          editingSettings.showSiteName = showSiteNameInput.checked;
          editingSettings.showSiteUrl = showSiteUrlInput.checked;
          settings = editingSettings;
          saveSettingsToStorage();

          githubConfig.owner = ownerInput.value.trim();
          githubConfig.repo = repoInput.value.trim();
          githubConfig.path = pathInput.value.trim();
          githubConfig.branch = branchInput.value.trim();
          saveGithubConfig();

          var token = tokenInput.value.trim();
          if (token) {
            localStorage.setItem(TOKEN_KEY, token);
          } else {
            localStorage.removeItem(TOKEN_KEY);
          }

          applySettingsToPage();
          closeSettingsModal();

          if (appInitialized) {
            var reloadToken = localStorage.getItem(TOKEN_KEY);
            var reloadConfig =
              githubConfig.owner &&
              githubConfig.repo &&
              githubConfig.path &&
              githubConfig.branch;
            if (reloadToken && reloadConfig) {
              loadSites();
            }
          } else {
            initializeApp();
          }
        });

        addForm.addEventListener("submit", function (event) {
          event.preventDefault();
          var name = nameInput.value.trim();
          var rawUrl = urlInput.value.trim();

          if (!rawUrl) {
            window.alert("请输入网址 URL");
            return;
          }

          var url;
          try {
            url = normalizeUrl(rawUrl);
          } catch (error) {
            window.alert("网址无效，请输入类似 example.com 的地址");
            return;
          }

          if (editingSiteId) {
            var editIndex = sites.findIndex(function (item) {
              return item.id === editingSiteId;
            });
            if (editIndex !== -1) {
              sites[editIndex] = {
                id: editingSiteId,
                name: name || hostname(url),
                url: url,
              };
            }
          } else {
            sites.push({
              id: uid(),
              name: name || hostname(url),
              url: url,
            });
          }
          saveSites();
          render();
          closeAddModal();
        });

        sitesEl.addEventListener("click", function (event) {
          var card = event.target.closest(".site-card");
          if (card && Date.now() < ignoreCardClickUntil) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        document.addEventListener("contextmenu", function (event) {
          event.preventDefault();

          if (event.target.closest(".context-menu")) {
            return;
          }
          if (Date.now() < suppressContextUntil) {
            return;
          }

          var card = event.target.closest(".site-card");
          if (card) {
            showMenu(event.clientX, event.clientY, card.dataset.id);
          } else {
            showMenu(event.clientX, event.clientY);
          }
        });

        menu.addEventListener("click", function (event) {
          var button = event.target.closest(".menu-btn");
          if (!button) {
            return;
          }
          var id = currentSiteId;
          var action = button.dataset.action;
          closeMenu();

          if (action === "open") {
            openSite(id);
          } else if (action === "edit") {
            openEditSite(id);
          } else if (action === "delete") {
            deleteSite(id);
          } else if (action === "add") {
            openAddModal();
          } else if (action === "settings") {
            openSettingsModal();
          }
        });

        document.addEventListener("click", function (event) {
          if (!menu.contains(event.target)) {
            closeMenu();
          }
        });

        window.addEventListener("scroll", closeMenu, true);
        window.addEventListener("resize", closeMenu);
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape") {
            closeMenu();
            closeAddModal();
            closeSettingsModal();
            closeTokenModal();
            closeConfirmModal();
          }
        });

        document.addEventListener(
          "touchstart",
          function (event) {
            if (event.touches.length !== 1) {
              return;
            }
            var touch = event.touches[0];
            longPressInfo = {
              x: touch.clientX,
              y: touch.clientY,
              target: event.target,
              long: false,
            };
            clearTimeout(longPressTimer);
            longPressTimer = window.setTimeout(function () {
              if (!longPressInfo) {
                return;
              }
              longPressInfo.long = true;
              suppressContextUntil = Date.now() + 900;

              if (
                longPressInfo.target.closest("input, textarea, button, .modal")
              ) {
                return;
              }

              var card = longPressInfo.target.closest(".site-card");
              if (card) {
                ignoreCardClickUntil = Date.now() + 900;
                showMenu(longPressInfo.x, longPressInfo.y, card.dataset.id);
              } else {
                showMenu(longPressInfo.x, longPressInfo.y);
              }

              if (navigator.vibrate) {
                navigator.vibrate(20);
              }
            }, 550);
          },
          { passive: true },
        );

        function cancelLongPress() {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          longPressInfo = null;
        }

        document.addEventListener(
          "touchmove",
          function (event) {
            if (!longPressInfo) {
              return;
            }
            var touch = event.touches[0];
            var dx = touch.clientX - longPressInfo.x;
            var dy = touch.clientY - longPressInfo.y;
            if (dx * dx + dy * dy > 100) {
              cancelLongPress();
            }
          },
          { passive: true },
        );

        document.addEventListener("touchend", function (event) {
          if (longPressInfo && longPressInfo.long) {
            event.preventDefault();
          }
          cancelLongPress();
        });

        document.addEventListener("touchcancel", cancelLongPress);

        applySettingsToPage();
        initializeApp();
        window.setInterval(updateClock, 1000);
      })();
    </script>
  </body>
</html>
